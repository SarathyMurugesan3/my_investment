version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: trading_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - trading_network

  redis:
    image: redis:alpine
    container_name: trading_redis
    ports:
      - "6379:6379"
    networks:
      - trading_network

volumes:
  mongo_data:

networks:
  trading_network:
    driver: bridge
