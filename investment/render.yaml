services:
  # Backend Service
  - type: web
    name: trading-analysis-backend
    env:.java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: LIVE
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_URL
        value: https://trading-analysis-backend.onrender.com
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "14"

  # Frontend Service (Static Site)
  - type: web
    name: trading-analysis-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    headers:
      - key: Access-Control-Allow-Origin
        value: "*"
