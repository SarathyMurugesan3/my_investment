name: Keep Render Server Alive

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes to keep Render server active
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -I -s https://securelearn-backend.onrender.com/actuator/health
          echo "Ping executed successfully at $(date)"
